<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>統計表產生器</title>
<style>
:root{--bg:#F6F4EE;--surface:#fff;--ink:#1E2622;--ink2:#55605A;--ink3:#8A928D;--line:#DCD5C6;--accent:#1F5A46;--soft:#E2EEE8;--warm:#B5651D;--warmsoft:#F6E8D8;--bad:#B42318}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;font-size:15px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
header{background:var(--surface);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
h1{font-size:18px;margin:0;color:var(--accent)}.ver{font-size:11px;color:var(--ink3)}
main{max-width:1200px;margin:0 auto;padding:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer}.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}.btn.sm{padding:4px 9px;font-size:13px}
input,select{border:1px solid var(--line);border-radius:6px;padding:5px 7px;background:#fff;min-width:0}
.hint{font-size:12px;color:var(--ink3)}
.wrap{overflow-x:auto}table{border-collapse:collapse;min-width:100%}
th,td{border:1px solid var(--line);padding:3px 4px;text-align:center;vertical-align:middle;font-size:14px}
th{background:var(--soft);font-weight:600;white-space:nowrap}
td input{width:100%;text-align:center}td.l input{text-align:left}
.s{width:62px}.n{width:104px}.c{width:130px}.d{width:78px}
.lv1{color:#1b7a46}.lv2{color:var(--warm);font-weight:600}.lv3{color:var(--bad);font-weight:700}.lvx{color:var(--bad)}
.note{background:var(--warmsoft);border-radius:8px;padding:8px 10px;font-size:13px;margin-bottom:10px}
.b{font-weight:700}.t{font-weight:400}.lt{padding:2px 6px;margin-left:2px;color:var(--ink3)}.lt.on{background:var(--accent);color:#fff;border-color:var(--accent)}.v{width:64px}
</style></head><body>
<header><h1>統計表產生器</h1><span class="ver">公司版　歷年數據 → 第95百分位／最高值 → 暴露等級 → 匯出 Excel</span></header>
<main>
<div class="card"><div class="row">
<label>公司名稱 <input id="co" style="width:220px"></label>
<button class="btn" id="addRound">＋新增一次監測</button><button class="btn" id="delRound">－刪最後一次</button>
<button class="btn" id="addRow">＋新增一列</button>
<button class="btn pri" id="exp">匯出統計表 Excel</button>
<button class="btn" id="clr">全部清空</button></div>
<div class="hint" style="margin-top:6px">日期填民國年月日，例 1130118。數值只打數字（例 0.525），不用打「<」。報告上有「<」的，按數字旁的 <  鈕（亮起＝細體）；沒有的顯示粗體。同一次有兩個以上測點，用 / 隔開（例 12.4/0.804），系統取較高值。</div></div>
<div class="note"><b>取值規則：</b>6 次以上用第95百分位（同 Excel PERCENTILE.INC，最多取 10 次）；未滿 6 次（1～5 次）取歷次最高值代入；沒有任何數據則標「待確認」。容許濃度沒有數值的化學品不分級，標「無標準」。</div>
<div class="card wrap"><table id="tb"></table></div>
<div class="card"><b>SEG 與監測處所對照</b>（匯出時放在表格下方）<div id="map" class="hint" style="margin-top:4px"></div></div>
</main>
<datalist id="dl"></datalist>

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function parseCell(t,nd){var best=null;String(t||'').split(/[\/、,，;；\s]+/).forEach(function(k){if(!k)return;var n=parseFloat(k.replace(/[<＜]/g,''));if(isNaN(n))return;if(!best||n>best.n)best={n:n,nd:!!nd}});return best}
function pctInc(a,p){var s=a.slice().sort(function(x,y){return x-y}),k=(s.length-1)*p,f=Math.floor(k),c=Math.min(f+1,s.length-1);return s[f]+(s[c]-s[f])*(k-f)}
function fmt(x){return String(parseFloat(Number(x).toPrecision(5)))}
function pelOf(r){var c=IDX[String(r.nm||'').trim()]||IDX[ALIAS[String(r.nm||'').trim()]];if(!c)return{nf:true};var raw=r.u==='mg/m3'?c.pm:(r.u==='ppm'?c.pp:'');var n=parseFloat(raw);return{pel:isNaN(n)?NaN:n,nf:false}}
function calc(r){
  var vs=[];S.dates.forEach(function(d,j){var p=parseCell(r.v[j],r.nd[j]);if(p)vs.push(p)});
  var out={n:vs.length,pel:pelOf(r)};
  if(!vs.length){out.method='待確認';return out}
  var nums=vs.map(function(p){return p.n});
  if(vs.length>=6){var use=nums.slice(-10);out.x=pctInc(use,0.95);out.method='第95百分位'}else{out.x=Math.max.apply(null,nums);out.method='取最高值（'+vs.length+'次）'}
  var p=out.pel;
  if(p.nf)out.lv='待確認（找不到化學品）';else if(isNaN(p.pel))out.lv='無標準';else out.lv=out.x>=p.pel?'第三級':(out.x>=p.pel*0.5?'第二級':'第一級');
  return out}
